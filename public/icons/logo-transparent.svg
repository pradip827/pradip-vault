<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="100%">
  <defs>
    <!-- Primary Blue/Cyan Gradient -->
    <linearGradient id="tCyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Accent Bright Cyan Gradient -->
    <linearGradient id="tAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Ambient Glow for Emblem -->
    <radialGradient id="tGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <filter id="tFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ================= EMBLEM ICON (LEFT) ================= -->
  <g transform="translate(10, 6)">
    <!-- Ambient Glow -->
    <circle cx="54" cy="54" r="50" fill="url(#tGlow)"/>

    <!-- Outer Shield Frame -->
    <path d="M 54 8
             L 94 24
             C 94 65, 78 94, 54 104
             C 30 94, 14 65, 14 24
             Z"
          fill="#090f1d"
          stroke="url(#tCyberGrad)"
          stroke-width="3"
          stroke-linejoin="round"
          filter="url(#tFilter)"/>

    <!-- Inner Shield Inset -->
    <path d="M 54 16
             L 86 28
             C 86 61, 73 85, 54 94
             C 35 85, 22 61, 22 28
             Z"
          fill="#060a14"
          stroke="#1e293b"
          stroke-width="1.5"
          stroke-linejoin="round"/>

    <!-- The "Zero" Ring with Ticks -->
    <circle cx="54" cy="54" r="26"
            fill="none"
            stroke="url(#tCyberGrad)"
            stroke-width="4.5"
            filter="url(#tFilter)"/>

    <circle cx="54" cy="54" r="31"
            fill="none"
            stroke="#0284c7"
            stroke-width="1"
            stroke-dasharray="4 5"
            stroke-opacity="0.7"/>

    <!-- 4 Cardinal Tumblers -->
    <rect x="52.5" y="24" width="3" height="6" rx="1.5" fill="#38bdf8"/>
    <rect x="52.5" y="78" width="3" height="6" rx="1.5" fill="#38bdf8"/>
    <rect x="24" y="52.5" width="6" height="3" rx="1.5" fill="#38bdf8"/>
    <rect x="78" y="52.5" width="6" height="3" rx="1.5" fill="#38bdf8"/>

    <!-- Center Padlock / Key Core -->
    <!-- Shackle -->
    <path d="M 48 50
             V 44
             C 48 40.5, 50.5 38, 54 38
             C 57.5 38, 60 40.5, 60 44
             V 50"
          fill="none"
          stroke="url(#tAccentGrad)"
          stroke-width="3"
          stroke-linecap="round"/>

    <!-- Lock Body -->
    <rect x="44" y="49" width="20" height="16" rx="4"
          fill="url(#tCyberGrad)"
          stroke="#67e8f9"
          stroke-width="1"
          filter="url(#tFilter)"/>

    <!-- Keyhole -->
    <circle cx="54" cy="55.5" r="2.2" fill="#040711"/>
    <polygon points="53,55.5 55,55.5 55.6,60.5 52.4,60.5" fill="#040711"/>
    <circle cx="54" cy="55.5" r="0.9" fill="#38bdf8"/>
  </g>

  <!-- ================= TYPOGRAPHIC LOGO (RIGHT) ================= -->
  <g transform="translate(136, 62)">
    <!-- Wordmark "ZERO" -->
    <text x="0" y="0"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif"
          font-size="52"
          font-weight="800"
          letter-spacing="-1px"
          fill="#ffffff">ZERO</text>

    <!-- Wordmark "VAULT" -->
    <text x="144" y="0"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif"
          font-size="52"
          font-weight="800"
          letter-spacing="-1px"
          fill="url(#tCyberGrad)">VAULT</text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="30"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif"
          font-size="11.5"
          font-weight="600"
          letter-spacing="4px"
          fill="#94a3b8">ZERO-KNOWLEDGE CLIENT ENCRYPTION</text>
  </g>
</svg>
