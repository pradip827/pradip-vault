<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0b1325"/>
      <stop offset="100%" stop-color="#04070f"/>
    </linearGradient>

    <!-- Primary Cyber Cyan/Blue Gradient -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Core Vault Light Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Gold/Amber Security Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Subtle Radial Ambience -->
    <radialGradient id="ambience" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#1e1b4b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Plate / Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="115" fill="none" stroke="#1e293b" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Core Ambient Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#ambience)"/>

  <!-- Outer Cryptographic Hex-Shield Contour -->
  <path d="M 256 64
           L 404 122
           C 404 274, 344 394, 256 448
           C 168 394, 108 274, 108 122
           Z"
        fill="#090f1d"
        fill-opacity="0.85"
        stroke="url(#cyberGrad)"
        stroke-width="7"
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Inner Shield Inset Frame -->
  <path d="M 256 86
           L 384 136
           C 384 266, 332 370, 256 418
           C 180 370, 128 266, 128 136
           Z"
        fill="#070c18"
        stroke="#1e293b"
        stroke-width="3"
        stroke-opacity="0.9"
        stroke-linejoin="round"/>

  <!-- Cipher Orbit Rings (The "0" of ZeroVault) -->
  <!-- Outer Zero Ring with segmented tick marks -->
  <circle cx="256" cy="252" r="112"
          fill="none"
          stroke="url(#cyberGrad)"
          stroke-width="12"
          filter="url(#neonGlow)"/>

  <circle cx="256" cy="252" r="126"
          fill="none"
          stroke="#0284c7"
          stroke-width="2"
          stroke-dasharray="14 18"
          stroke-opacity="0.6"/>

  <!-- Inner Vault Torus -->
  <circle cx="256" cy="252" r="76"
          fill="#0a1224"
          stroke="url(#accentGrad)"
          stroke-width="4"/>

  <!-- Cardinal Cryptographic Tumblers / Bolts (Representing Multi-Layered Protection) -->
  <!-- Top Bolt -->
  <rect x="251" y="128" width="10" height="22" rx="5" fill="#38bdf8" filter="url(#intenseGlow)"/>
  <!-- Bottom Bolt -->
  <rect x="251" y="354" width="10" height="22" rx="5" fill="#38bdf8" filter="url(#intenseGlow)"/>
  <!-- Left Bolt -->
  <rect x="132" y="247" width="22" height="10" rx="5" fill="#38bdf8" filter="url(#intenseGlow)"/>
  <!-- Right Bolt -->
  <rect x="358" y="247" width="22" height="10" rx="5" fill="#38bdf8" filter="url(#intenseGlow)"/>

  <!-- 45-degree Precision Accent Dots -->
  <circle cx="177" cy="173" r="4.5" fill="#60a5fa" opacity="0.8"/>
  <circle cx="335" cy="173" r="4.5" fill="#60a5fa" opacity="0.8"/>
  <circle cx="177" cy="331" r="4.5" fill="#60a5fa" opacity="0.8"/>
  <circle cx="335" cy="331" r="4.5" fill="#60a5fa" opacity="0.8"/>

  <!-- Central Vault Lock Core / The Zero Core -->
  <!-- Padlock Arch / Keyway Geometry -->
  <path d="M 234 234
           V 212
           C 234 198, 244 188, 256 188
           C 268 188, 278 198, 278 212
           V 234"
        fill="none"
        stroke="url(#accentGrad)"
        stroke-width="9"
        stroke-linecap="round"/>

  <!-- Lock Body -->
  <rect x="220" y="230" width="72" height="56" rx="14"
        fill="url(#cyberGrad)"
        stroke="#67e8f9"
        stroke-width="2.5"
        filter="url(#neonGlow)"/>

  <!-- Keyhole (Glow Center) -->
  <circle cx="256" cy="252" r="7.5" fill="#040711"/>
  <polygon points="252.5,252 259.5,252 262,269 250,269" fill="#040711"/>
  <circle cx="256" cy="252" r="3" fill="#38bdf8" filter="url(#intenseGlow)"/>

  <!-- Bottom Crest Accent (Argon2 / AES Shield Gem) -->
  <polygon points="256,416 266,428 256,440 246,428"
           fill="url(#accentGrad)"
           filter="url(#neonGlow)"/>
</svg>
